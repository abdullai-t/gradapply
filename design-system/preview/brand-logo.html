<!DOCTYPE html>
<html lang="en" class="dark"><head>
<meta charset="utf-8"><title>Brand Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);display:flex;gap:24px;align-items:center}
.mark{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;box-shadow:0 8px 32px hsl(var(--primary) / .45);border:1px solid hsl(43 90% 60% / .3)}
.logo.sm{width:36px;height:36px;border-radius:12px}
.wm{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:11px;color:hsl(var(--muted-foreground))}
</style></head>
<body class="ds-preview">
<div class="mark"><img class="logo" src="../assets/logo.png" alt=""/><div><div class="wm">GradApply</div><div class="sub">Application companion</div></div></div>
<div class="mark"><img class="logo sm" src="../assets/logo.png" alt=""/><div><div class="wm" style="font-size:14px">GradApply</div><div class="sub">Scholar Pursuit Hub</div></div></div>
</body></html>
