<!DOCTYPE html>
<html lang="en" class="dark"><head>
<meta charset="utf-8"><title>Colors — Brand & Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .sw{border-radius:10px;padding:10px;border:1px solid hsl(var(--border));height:96px;display:flex;flex-direction:column;justify-content:space-between}
  .sw .n{font-size:11px;font-weight:600;color:hsl(var(--foreground))}
  .sw .h{font-family:var(--font-mono);font-size:10px;color:hsl(var(--muted-foreground))}
</style></head>
<body class="ds-preview">
<div class="grid">
  <div class="sw" style="background:hsl(var(--nav-900))"><div class="n" style="color:#fff">nav-900</div><div class="h">230 35% 7%</div></div>
  <div class="sw" style="background:hsl(var(--nav-800))"><div class="n" style="color:#fff">nav-800</div><div class="h">232 32% 11%</div></div>
  <div class="sw" style="background:hsl(var(--nav-750))"><div class="n" style="color:#fff">nav-750</div><div class="h">232 28% 16%</div></div>
  <div class="sw" style="background:hsl(var(--nav-700))"><div class="n" style="color:#fff">nav-700</div><div class="h">232 25% 18%</div></div>
  <div class="sw" style="background:hsl(var(--nav-650))"><div class="n" style="color:#fff">nav-650</div><div class="h">232 22% 22%</div></div>
  <div class="sw" style="background:hsl(var(--gold-500))"><div class="n" style="color:#231a00">gold-500 / primary</div><div class="h" style="color:#231a00">43 78% 54%</div></div>
  <div class="sw" style="background:hsl(var(--gold-400))"><div class="n" style="color:#231a00">gold-400</div><div class="h" style="color:#231a00">43 74% 52%</div></div>
  <div class="sw" style="background:hsl(var(--gold-200))"><div class="n" style="color:#231a00">gold-200</div><div class="h" style="color:#231a00">43 85% 80%</div></div>
  <div class="sw" style="background:hsl(var(--plum-500))"><div class="n">plum-500</div><div class="h">275 55% 45%</div></div>
  <div class="sw" style="background:hsl(var(--plum-400))"><div class="n">plum-400</div><div class="h">278 85% 62%</div></div>
  <div class="sw" style="background:hsl(var(--sky-300))"><div class="n" style="color:#001f2b">sky-300</div><div class="h" style="color:#001f2b">196 100% 75%</div></div>
  <div class="sw" style="background:hsl(var(--gold-100))"><div class="n" style="color:#231a00">fg-1 (text)</div><div class="h" style="color:#231a00">40 20% 96%</div></div>
</div>
</body></html>
