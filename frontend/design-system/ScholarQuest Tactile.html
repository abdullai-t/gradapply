<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ScholarQuest — Tactile Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"/>
<link rel="stylesheet" href="tactile/tokens.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#00629d"/>
    <rect x="35" y="30" width="30" height="40" rx="3" fill="#fff"/>
    <circle cx="50" cy="25" r="5" fill="#FF9600"/>
  </svg>
</template>
<script type="text/babel" src="tactile/Shell.jsx"></script>
<script type="text/babel" src="tactile/Dashboard.jsx"></script>
<script type="text/babel" src="tactile/Schools.jsx"></script>
<script type="text/babel" src="tactile/Timeline.jsx"></script>
<script type="text/babel" src="tactile/Outreach.jsx"></script>
<script type="text/babel" src="tactile/Documents.jsx"></script>
<script type="text/babel" src="tactile/Assistant.jsx"></script>
<script type="text/babel" src="tactile/Pages.jsx"></script>
<script type="text/babel">
const titles = {
  dashboard: { t: 'Dashboard', s: 'Search across everything...' },
  schools: { t: 'Schools', s: 'Search schools...' },
  timeline: { t: 'Timeline & Deadlines', s: 'Search deadlines...' },
  outreach: { t: 'Outreach', s: 'Search threads...' },
  documents: { t: 'Documents', s: 'Search documents...' },
  assistant: { t: 'AI Assistant', s: 'Search conversations...' },
  profile: { t: 'Profile', s: 'Search resources...' },
  settings: { t: 'Settings', s: 'Search settings...' },
};

function App() {
  const [route, setRoute] = React.useState(() => {
    try { return localStorage.getItem('sq-tactile-route') || 'dashboard'; } catch { return 'dashboard'; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('sq-tactile-route', route); } catch {}
    window.scrollTo(0, 0);
  }, [route]);

  const pageMap = {
    dashboard: <Dashboard />,
    schools: <Schools />,
    timeline: <Timeline />,
    outreach: <Outreach />,
    documents: <Documents />,
    assistant: <Assistant />,
    profile: <Profile />,
    settings: <Settings />,
  };

  const meta = titles[route];
  return (
    <NavContext.Provider value={{ route, setRoute }}>
      <Page key={route} title={meta.t} searchPlaceholder={meta.s} fabIcon={route === 'assistant' || route === 'profile' || route === 'settings' ? null : 'smart_toy'}>
        {pageMap[route]}
      </Page>
    </NavContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
